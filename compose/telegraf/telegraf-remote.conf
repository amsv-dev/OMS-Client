# Telegraf Configuration for OMS logical collector by host
# Collects only dynamically generated remote logical asset inputs and writes to local InfluxDB

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "${ASSET_ID:-unknown}"
  omit_hostname = false

[global_tags]
  tenant_id = "${TENANT_ID:-unknown}"
  asset_id = "${ASSET_ID:-unknown}"
  runtime_asset_id = "${RUNTIME_ASSET_ID:-${ASSET_ID:-unknown}}"
  service_id = "${LOGICAL_ASSET_ID:-}"
  collector_host = "${ASSET_ID:-unknown}"
  host_address = "${HOST_ADDRESS:-}"
  collector_type = "${COLLECTOR_TYPE:-telegraf}"
  origin_scope = "${ORIGIN_SCOPE:-remote}"
  service_type = "${SERVICE_TYPE:-logical}"
  site_code = "${SITE_CODE:-${ASSET_ID:-unknown}}"
  environment = "${OBS_ENVIRONMENT:-prod}"
  source = "telegraf"

# Keep the process healthy before the first logical input snippet appears in telegraf.d.
[[inputs.internal]]
  collect_memstats = false
  namepass = ["__oms_logical_placeholder__"]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb-local:8086"]
  token = "client-local-token"
  organization = "client"
  bucket = "metrics"

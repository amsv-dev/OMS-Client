# Telegraf Configuration for OMS Client
# Collects system metrics and sends to local InfluxDB

[agent]
  interval = "30s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "${ASSET_ID:-unknown}"
  omit_hostname = false

# Global tags required by the OMS observability contract.
[global_tags]
  tenant_id = "${TENANT_ID:-unknown}"
  asset_id = "${ASSET_ID:-unknown}"
  runtime_asset_id = "${RUNTIME_ASSET_ID:-${ASSET_ID:-unknown}}"
  service_id = "${LOGICAL_ASSET_ID:-}"
  collector_host = "${ASSET_ID:-unknown}"
  host_address = "${HOST_ADDRESS:-${ASSET_ID:-unknown}}"
  collector_type = "${COLLECTOR_TYPE:-telegraf}"
  origin_scope = "${ORIGIN_SCOPE:-local}"
  service_type = "${SERVICE_TYPE:-host}"
  site_code = "${SITE_CODE:-${ASSET_ID:-unknown}}"
  environment = "${OBS_ENVIRONMENT:-prod}"
  source = "telegraf"

# Additional logical asset collectors for the runtime mode are loaded from:
#   /etc/telegraf/telegraf.d/*.conf
# In distributed mode, logical collectors are sharded into dedicated Telegraf services.

###############################################################################
#                            INPUT PLUGINS                                    #
###############################################################################

# CPU Usage
[[inputs.cpu]]
  percpu = false
  totalcpu = true
  collect_cpu_time = false
  report_active = false

# Memory Usage
[[inputs.mem]]

# Disk Usage
[[inputs.disk]]
  ignore_fs = ["tmpfs", "devtmpfs", "devfs", "iso9660", "overlay", "aufs", "squashfs"]

# Disk I/O
[[inputs.diskio]]

# System Load
[[inputs.system]]

# Network Traffic
[[inputs.net]]
  interfaces = ["eth*", "en*"]

# Processes
[[inputs.processes]]

# O7 (2026-11-18): input REMOVIDO — apontava a http://customer-agent:8080/local/credentials/metrics,
# que estava errado na porta (a API local do agente é :5808, nao :8080) E no endpoint: o
# `/local/credentials/metrics` NAO EXISTE no agente (so ha `/local/credentials/state`, que devolve
# JSON e exige token — incompativel com data_format="influx"). O scrape 404-ava em silencio a cada
# 60s, sem produzir metrica nenhuma. Se se quiser mesmo as metricas do credstore, e preciso IMPLEMENTAR
# um endpoint que devolva line-protocol (decisao de produto), e so entao reintroduzir este input.

###############################################################################
#                            OUTPUT PLUGINS                                   #
###############################################################################

# Output to local InfluxDB
[[outputs.influxdb_v2]]
  urls = ["http://influxdb-local:8086"]
  token = "${INFLUXDB_LOCAL_TOKEN}"
  organization = "${INFLUXDB_LOCAL_ORG}"
  bucket = "${INFLUXDB_LOCAL_BUCKET}"

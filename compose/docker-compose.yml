services:
  # HashiCorp Vault OSS - Cofre de credenciais do cliente (PR3)
  # Storage backend: file (volume persistente)
  # Auto-unseal: SO-protected key + recovery Shamir offline (ver entrypoint.sh)
  # Network: client-network apenas (NUNCA exposto a oms-shared-network)
  vault:
    image: hashicorp/vault:1.17
    container_name: oms-vault
    restart: always
    cap_add:
      - IPC_LOCK   # necessario para mlock (proteger chaves master de swap)
    volumes:
      - vault-file:/vault/file
      - vault-logs:/vault/logs
      - ./vault/config:/vault/config:ro
      - ./vault/scripts:/vault/scripts:ro
      - ./secrets/vault:/vault/secrets   # recovery keys + autounseal.key (host-mounted)
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
      - VAULT_API_ADDR=http://oms-vault:8200
    entrypoint:
      - /bin/sh
      - /vault/scripts/entrypoint.sh
    networks:
      - client-network
    healthcheck:
      test:
        - CMD-SHELL
        - "vault status -format=json 2>/dev/null | grep -q '\"sealed\": false' && [ -f /vault/secrets/.unsealed ]"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # InfluxDB Local - Armazena métricas localmente para resiliência
  influxdb-local:
    image: influxdb:2.7-alpine
    container_name: client-influxdb
    restart: always
    ports:
      - "${CLIENT_INFLUXDB_HTTP_PORT:-8087}:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=localpass123
      - DOCKER_INFLUXDB_INIT_ORG=client
      - DOCKER_INFLUXDB_INIT_BUCKET=metrics
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=client-local-token
    volumes:
      - influxdb-local-data:/var/lib/influxdb2
    networks:
      - client-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Telegraf - Coleta métricas do sistema e envia para InfluxDB local
  # Versao fixada 1.32-alpine para garantir suporte ao plugin secretstores.vault (>= 1.30).
  telegraf:
    image: telegraf:1.32-alpine
    container_name: client-telegraf
    restart: always
    env_file:
      - .env
    environment:
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys
      - HOST_ETC=/host/etc
      - TENANT_ID=${TENANT_ID:-unknown}
      - ASSET_ID=${ASSET_ID:-unknown}
      - RUNTIME_ASSET_ID=${RUNTIME_ASSET_ID:-${ASSET_ID:-unknown}}
      - LOGICAL_ASSET_ID=${LOGICAL_ASSET_ID:-}
      - COLLECTOR_TYPE=${COLLECTOR_TYPE:-telegraf}
      - ORIGIN_SCOPE=${ORIGIN_SCOPE:-local}
      - SERVICE_TYPE=${SERVICE_TYPE:-host}
      - SITE_CODE=${SITE_CODE:-${ASSET_ID:-unknown}}
      - OBS_ENVIRONMENT=${OBS_ENVIRONMENT:-prod}
      - OBSERVABILITY_MODE=${OBSERVABILITY_MODE:-centralized-runtime}
      - DB_REMOTE_COLLECTORS_ENABLED=${DB_REMOTE_COLLECTORS_ENABLED:-false}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
      - ./telegraf/dynamic/runtime:/etc/telegraf/telegraf.d:ro
      # Token Vault read-only para o Telegraf, escrito pelo VaultBootstrap (PR4)
      - ./secrets/telegraf-vault-token:/etc/telegraf/secrets/vault-token:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
    command:
      - telegraf
      - --config
      - /etc/telegraf/telegraf.conf
      - --config-directory
      - /etc/telegraf/telegraf.d
      - --watch-config
      - poll
    depends_on:
      influxdb-local:
        condition: service_healthy
      vault:
        condition: service_healthy
    networks:
      - client-network

  # Telegraf por host remoto (modo per-host-collectors): gerado em docker-compose.host-collectors.generated.yml pelo customer-agent

  # Customer Agent - Replica métricas, processa alertas, executa comandos
  # CLIENT_IMAGE_REGISTRY: ghcr.io público (pull sem login) ou override para testes
  customer-agent:
    image: ${CLIENT_IMAGE_REGISTRY:-ghcr.io/amsv-dev}/oms-customer-agent:${OMS_IMAGE_TAG:-latest}
    container_name: client-customer-agent
    restart: always
    env_file:
      - .env
    environment:
      # Identidade runtime
      - TENANT_ID=${TENANT_ID:-unknown}
      - ASSET_ID=${ASSET_ID:-unknown}
      - RUNTIME_ASSET_ID=${RUNTIME_ASSET_ID:-${ASSET_ID:-unknown}}
      - LOGICAL_ASSET_ID=${LOGICAL_ASSET_ID:-}
      - COLLECTOR_TYPE=${COLLECTOR_TYPE:-telegraf}
      - ORIGIN_SCOPE=${ORIGIN_SCOPE:-local}
      - SERVICE_TYPE=${SERVICE_TYPE:-host}
      - SITE_CODE=${SITE_CODE:-${ASSET_ID:-unknown}}
      - OBS_ENVIRONMENT=${OBS_ENVIRONMENT:-prod}
      - OBSERVABILITY_MODE=${OBSERVABILITY_MODE:-centralized-runtime}
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:${LOCAL_RUNTIME_API_PORT:-5808}
      
      # Solace - Comunicação com cloud layer
      - SOLACE__HOST=${SOLACE__HOST:-192.168.56.30}
      - SOLACE__PORT=${SOLACE__PORT:-1883}
      - SOLACE__VPN=${SOLACE__VPN:-default}
      - SOLACE__USERNAME=${SOLACE__USERNAME:-default}
      - SOLACE__PASSWORD=${SOLACE__PASSWORD:-default}
      - METRICS_TOPIC_PREFIX=${METRICS_TOPIC_PREFIX:-oms.metrics.frames}
      - METRICS_ALLOWED_MEASUREMENTS=${METRICS_ALLOWED_MEASUREMENTS:-cpu,mem,disk,diskio,system,net,processes,postgresql,mysql,sqlserver}
      - CENTRAL_API_URL=${CENTRAL_API_URL:-}
      - ASSESSMENT_TOKEN=${ASSESSMENT_TOKEN:-}
      - ASSESSMENT_TOKEN_FILE=${ASSESSMENT_TOKEN_FILE:-/app/secrets/assessment-token.txt}
      - ASSESSMENT_TOKEN_FALLBACKS=${ASSESSMENT_TOKEN_FALLBACKS:-}
      - LOGICAL_ASSET_SYNC_INTERVAL_SECONDS=${LOGICAL_ASSET_SYNC_INTERVAL_SECONDS:-60}
      - LOGICAL_ASSETS_SOFT_LIMIT=${LOGICAL_ASSETS_SOFT_LIMIT:-25}
      - COLLECTOR_PLACEMENT_STRATEGY=${COLLECTOR_PLACEMENT_STRATEGY:-runtime-host}
      - COLLECTOR_AUTO_SCALE_ENABLED=${COLLECTOR_AUTO_SCALE_ENABLED:-false}
      - REMOTE_TELEGRAF_PROVISIONING_ENABLED=${REMOTE_TELEGRAF_PROVISIONING_ENABLED:-false}
      - REMOTE_TELEGRAF_OUTPUT_URL=${REMOTE_TELEGRAF_OUTPUT_URL:-}
      - REMOTE_TELEGRAF_SSH_USER=${REMOTE_TELEGRAF_SSH_USER:-}
      - REMOTE_TELEGRAF_SSH_KEY_PATH=${REMOTE_TELEGRAF_SSH_KEY_PATH:-}
      - REMOTE_TELEGRAF_SSH_PORT=${REMOTE_TELEGRAF_SSH_PORT:-22}
      - REMOTE_TELEGRAF_CONFIG_DIR=${REMOTE_TELEGRAF_CONFIG_DIR:-/opt/oms/telegraf}
      - LOGICAL_COLLECTOR_CONF_DIR=${LOGICAL_COLLECTOR_CONF_DIR:-/app/telegraf-dynamic}
      - OMS_COMPOSE_PROJECT_DIR=${OMS_COMPOSE_HOST_PROJECT_DIR:-/app/oms-compose-workdir}
      - OMS_COMPOSE_PROJECT_NAME=${OMS_COMPOSE_PROJECT_NAME:-compose}
      - LOGICAL_SECRET_STORE_PATH=/app/secrets/logical-secret-store.json
      # Vault (PR4)
      - OMS_CREDSTORE_MODE=${OMS_CREDSTORE_MODE:-File}
      - VAULT_ADDR=${VAULT_ADDR:-http://oms-vault:8200}
      - VAULT_APPROLE_DIR=/app/secrets/vault-approle
      - VAULT_TELEGRAF_TOKEN_PATH=/app/secrets/telegraf-vault-token
      - VAULT_RECOVERY_FILE=/vault/secrets/recovery-keys-FIRST-BOOT-ONLY.json

      # InfluxDB Local - Leitura de métricas
      - INFLUXDB_LOCAL_URL=http://influxdb-local:8086
      - INFLUXDB_LOCAL_TOKEN=client-local-token
      - INFLUXDB_LOCAL_ORG=client
      - INFLUXDB_LOCAL_BUCKET=metrics
    depends_on:
      influxdb-local:
        condition: service_healthy
      vault:
        condition: service_healthy
    volumes:
      - ../automation/playbooks:/app/playbooks:ro
      - ./telegraf/dynamic:/app/telegraf-dynamic
      - .:/app/oms-compose-workdir:rw
      - .:${OMS_COMPOSE_HOST_PROJECT_DIR:-/app/oms-compose-workdir}:rw
      - /var/run/docker.sock:/var/run/docker.sock
      - ./secrets:/app/secrets
      - ./secrets/vault:/vault/secrets:ro
      # Audit log + first-boot instructions partilhados com o oms-vault (read-only).
      # Usado pelo VaultManagementService para preview de audit na UI "Cofre" (B2).
      - vault-logs:/vault/logs:ro
    networks:
      - client-network
      - oms-shared-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # Promtail - Logs de sistema da VM client para Central Loki (multi-tenant)
  promtail:
    image: grafana/promtail:latest
    container_name: client-promtail
    restart: always
    environment:
      - TENANT_ID=${TENANT_ID:-unknown}
      - ASSET_ID=${ASSET_ID:-unknown}
      - LOCAL_RUNTIME_API_URL=${LOCAL_RUNTIME_API_URL:-/runtime-local}
      - LOKI_URL=${LOKI_URL:-http://192.168.56.10:3100/loki/api/v1/push}
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks:
      - client-network

  # Assessment UI - Client onboarding frontend
  assessment:
    image: ${CLIENT_IMAGE_REGISTRY:-ghcr.io/amsv-dev}/oms-assessment:${OMS_IMAGE_TAG:-latest}
    container_name: client-assessment
    restart: always
    ports:
      - "${CLIENT_ASSESSMENT_HTTP_PORT:-3002}:80"
    environment:
      - TENANT_ID=${TENANT_ID:-unknown}
      - ASSET_ID=${ASSET_ID:-unknown}
      - SITE_CODE=${SITE_CODE:-}
    depends_on:
      - customer-agent
    networks:
      - client-network

  # Assessment UI v2 - Client onboarding frontend (shadcn layout)
  assessment-v2:
    image: ${CLIENT_IMAGE_REGISTRY:-ghcr.io/amsv-dev}/oms-assessment-v2:${OMS_IMAGE_TAG:-latest}
    container_name: client-assessment-v2
    restart: always
    ports:
      - "${CLIENT_ASSESSMENT_V2_HTTP_PORT:-3122}:80"
    environment:
      - TENANT_ID=${TENANT_ID:-unknown}
      - ASSET_ID=${ASSET_ID:-unknown}
      - SITE_CODE=${SITE_CODE:-}
      - CENTRAL_API_URL=${CENTRAL_API_URL:-}
    depends_on:
      - customer-agent
    networks:
      - client-network

  # NOTE: Remote execution via CommandReceiverService (Solace)
  # See documentacao/decisoes/ADR-001-remote-execution.md

  # Demo Triggers - Serviço de teste para disparar eventos (apenas dev)
  demo-triggers:
    image: node:20-alpine
    container_name: client-demo-triggers
    restart: always
    working_dir: /app
    volumes:
      - ../demo-triggers:/app
    command: sh -c "npm install && node server.js"
    ports:
      - "${CLIENT_DEMO_TRIGGERS_PORT:-3101}:3001"
    environment:
      - SOLACE__HOST=192.168.56.30
    networks:
      - client-network
    profiles:
      - dev

volumes:
  influxdb-local-data:
    external: true
    name: compose_influxdb-local-data
  vault-file:
    driver: local
  vault-logs:
    driver: local

networks:
  client-network:
    driver: bridge
  oms-shared-network:
    external: true

---
# Remediação (disk-full): roda os logs e limpa SÓ temporários conhecidos. DESTRUTIVO → nunca-auto.
# Extra-vars: temp_glob (opcional, ex. /var/tmp/*.tmp). Nunca caminhos arbitrários.
- name: Rotate logs and clean known temp
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Force logrotate
      ansible.builtin.command: "logrotate -f /etc/logrotate.conf"
      changed_when: true
    - name: Remove known temp files (se temp_glob definido)
      ansible.builtin.shell: "find {{ temp_glob }} -type f -mtime +1 -delete"
      when: temp_glob is defined and temp_glob | length > 0
      changed_when: true
